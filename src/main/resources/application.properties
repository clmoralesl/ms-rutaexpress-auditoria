server.port=8084
spring.application.name=ms-rutaexpress-auditoria

# ===== Conexion Oracle Cloud (Autonomous DB con Wallet) =====
spring.datasource.url=${ORACLE_DB_URL}
spring.datasource.username=${ORACLE_AUDITORIA_USERNAME}
spring.datasource.password=${ORACLE_AUDITORIA_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Ubicacion del wallet
oracle.net.tns_admin=${ORACLE_WALLET_LOCATION}
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${ORACLE_WALLET_LOCATION}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Apache Kafka =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=auditoria-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Topico de Kafka
kafka.topic.shipments-events=${KAFKA_TOPIC_SHIPMENTS_EVENTS:shipments.events}

# ===== Actuator y Salud =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
